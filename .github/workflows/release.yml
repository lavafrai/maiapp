name: Publish release builds

on:
    release:
        types: [ published ]
    workflow_dispatch:
        inputs:
            tag:
                description: 'Version to build (e.g. 1.0.5 or v1.0.5)'
                required: true
            upload:
                description: 'Attach builds to the GitHub release with this tag (otherwise only upload workflow artifacts)'
                type: boolean
                default: false

permissions:
    contents: write

concurrency:
    group: release-${{ github.event.release.tag_name || inputs.tag }}
    cancel-in-progress: false

env:
    RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    # Manual runs build the ref picked in "Run workflow"; release runs build the release tag.
    CHECKOUT_REF: ${{ github.event.release.tag_name || github.ref }}
    PUBLISH: ${{ github.event_name == 'release' || inputs.upload }}

jobs:
    version:
        name: Resolve version
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.version.outputs.version }}
        steps:
            - name: Parse version from tag
              id: version
              shell: bash
              run: |
                  version="${RELEASE_TAG#v}"
                  if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                    echo "Release tag '$RELEASE_TAG' must look like 1.2.3 or v1.2.3"
                    exit 1
                  fi
                  echo "version=$version" >> "$GITHUB_OUTPUT"

            - name: Check out gradle.properties
              if: github.event_name == 'release'
              uses: actions/checkout@v7
              with:
                  ref: ${{ env.CHECKOUT_REF }}
                  persist-credentials: false
                  sparse-checkout: gradle.properties
                  sparse-checkout-cone-mode: false

            # F-Droid builds the tag without MAIAPP_BUILD_VERSION, so it takes the version from gradle.properties
            - name: Check the version in sources
              if: github.event_name == 'release'
              shell: bash
              env:
                  VERSION: ${{ steps.version.outputs.version }}
              run: |
                  source_version="$(sed -n 's/^maiapp\.version=//p' gradle.properties)"
                  source_code="$(sed -n 's/^maiapp\.versionCode=//p' gradle.properties)"
                  IFS=. read -r major minor patch <<< "$VERSION"
                  expected_code=$((10#$major * 1000000 + 10#$minor * 1000 + 10#$patch))
                  if [[ "$source_version" != "$VERSION" || "$source_code" != "$expected_code" ]]; then
                    echo "::error::gradle.properties must have maiapp.version=$VERSION and maiapp.versionCode=$expected_code, but has $source_version and $source_code. Bump them before tagging: F-Droid builds the tag sources"
                    exit 1
                  fi

    build_android:
        name: Build Android
        runs-on: ubuntu-latest
        needs: version
        env:
            MAIAPP_BUILD_VERSION: ${{ needs.version.outputs.version }}
            ANDROID_KEYSTORE: "../android.keystore"
            ANDROID_KEYSTORE_KEY: ${{ secrets.android_key_alias }}
            ANDROID_KEYSTORE_KEY_PASSWORD: ${{ secrets.android_key_password }}
            ANDROID_KEYSTORE_PASSWORD: ${{ secrets.android_keystore_password }}
        steps:
            - name: Check out release tag
              uses: actions/checkout@v7
              with:
                  ref: ${{ env.CHECKOUT_REF }}
                  persist-credentials: false

            - uses: ./.github/actions/common-build-setup
              with:
                  java-version: '17'
                  secrets-properties: ${{ secrets.SECRETS_PROPERTIES }}

            - name: Decode keystore
              uses: akiojin/decode-base64-github-action@v1
              with:
                  base64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
                  output-path: '${{ github.workspace }}/android.keystore'

            - name: Build release APKs
              run: ./gradlew :androidApp:assembleFullRelease :androidApp:assembleFossRelease

            # foss is the F-Droid variant without AppMetrica, but signed with our key.
            # Exact names: without a keystore the build makes *-unsigned.apk, which must not be published
            - name: Rename APKs
              run: |
                  mv androidApp/build/outputs/apk/full/release/androidApp-full-release.apk "maiapp-${MAIAPP_BUILD_VERSION}.apk"
                  mv androidApp/build/outputs/apk/foss/release/androidApp-foss-release.apk "maiapp-${MAIAPP_BUILD_VERSION}-foss.apk"

            - name: Upload APK artifact
              uses: actions/upload-artifact@v7
              with:
                  name: android-release
                  path: |
                      maiapp-${{ env.MAIAPP_BUILD_VERSION }}.apk
                      maiapp-${{ env.MAIAPP_BUILD_VERSION }}-foss.apk

            - name: Upload APKs to release
              if: env.PUBLISH == 'true'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh release upload "$RELEASE_TAG" "maiapp-${MAIAPP_BUILD_VERSION}.apk" "maiapp-${MAIAPP_BUILD_VERSION}-foss.apk" --clobber --repo "${{ github.repository }}"

    build_ios:
        name: Build iOS (sideload IPA)
        runs-on: macos-latest
        needs: version
        env:
            VERSION: ${{ needs.version.outputs.version }}
        steps:
            - name: Check out release tag
              uses: actions/checkout@v7
              with:
                  ref: ${{ env.CHECKOUT_REF }}
                  persist-credentials: false

            - uses: ./.github/actions/common-build-setup
              with:
                  java-version: '17'
                  secrets-properties: ${{ secrets.SECRETS_PROPERTIES }}

            - uses: ./.github/actions/build-ios-sideload
              id: ipa
              with:
                  ipa-name: maiapp-${{ env.VERSION }}-sideload.ipa
                  marketing-version: ${{ env.VERSION }}

            - name: Upload IPA artifact
              uses: actions/upload-artifact@v7
              with:
                  name: ios-release
                  path: ${{ steps.ipa.outputs.ipa-path }}

            - name: Upload IPA to release
              if: env.PUBLISH == 'true'
              env:
                  GH_TOKEN: ${{ github.token }}
                  IPA_PATH: ${{ steps.ipa.outputs.ipa-path }}
              run: gh release upload "$RELEASE_TAG" "$IPA_PATH" --clobber --repo "${{ github.repository }}"

    build_web:
        name: Build release WEB image
        runs-on: ubuntu-latest
        needs: version
        permissions:
            contents: read
            packages: write
        env:
            MAIAPP_BUILD_VERSION: ${{ needs.version.outputs.version }}
        steps:
            - name: Check out release tag
              uses: actions/checkout@v7
              with:
                  ref: ${{ env.CHECKOUT_REF }}
                  persist-credentials: false

            - uses: ./.github/actions/common-build-setup
              with:
                  java-version: '21'
                  secrets-properties: ${{ secrets.SECRETS_PROPERTIES }}

            - name: Build release web bundle
              run: ./gradlew :composeApp:wasmJsBrowserDistribution

            - name: Prepare PWA distribution
              run: python3 scripts/prepare-web-distribution.py composeApp/build/dist/wasmJs/productionExecutable "release-${MAIAPP_BUILD_VERSION}-${GITHUB_SHA}" release

            - name: Upload WEB artifact
              uses: actions/upload-artifact@v7
              with:
                  name: web-release
                  path: composeApp/build/dist/wasmJs/productionExecutable

            - uses: docker/login-action@v4
              if: env.PUBLISH == 'true'
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Publish release web image
              if: env.PUBLISH == 'true'
              shell: bash
              run: |
                  image="ghcr.io/${GITHUB_REPOSITORY,,}/maiapp-web"
                  mkdir -p build/web-image/app
                  cp server-configs/nginx-web/nginx.conf build/web-image/nginx.conf
                  cp -a composeApp/build/dist/wasmJs/productionExecutable/. build/web-image/app/
                  docker build -f Dockerfile.web -t "$image:latest" build/web-image
                  docker push "$image:latest"
