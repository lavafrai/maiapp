name: Publish release builds

on:
    release:
        types: [ published ]
    workflow_dispatch:
        inputs:
            tag:
                description: 'Version to build (e.g. 1.0.5 or v1.0.5)'
                required: true
            upload:
                description: 'Attach builds to the GitHub release with this tag (otherwise only upload workflow artifacts)'
                type: boolean
                default: false

permissions:
    contents: write

concurrency:
    group: release-${{ github.event.release.tag_name || inputs.tag }}
    cancel-in-progress: false

env:
    RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    # Manual runs build the ref picked in "Run workflow"; release runs build the release tag.
    CHECKOUT_REF: ${{ github.event.release.tag_name || github.ref }}
    PUBLISH: ${{ github.event_name == 'release' || inputs.upload }}

jobs:
    version:
        name: Resolve version
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.version.outputs.version }}
        steps:
            - name: Parse version from tag
              id: version
              shell: bash
              run: |
                  version="${RELEASE_TAG#v}"
                  if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                    echo "Release tag '$RELEASE_TAG' must look like 1.2.3 or v1.2.3"
                    exit 1
                  fi
                  echo "version=$version" >> "$GITHUB_OUTPUT"

    build_android:
        name: Build Android
        runs-on: ubuntu-latest
        needs: version
        env:
            MAIAPP_BUILD_VERSION: ${{ needs.version.outputs.version }}
            ANDROID_KEYSTORE: "../android.keystore"
            ANDROID_KEYSTORE_KEY: ${{ secrets.android_key_alias }}
            ANDROID_KEYSTORE_KEY_PASSWORD: ${{ secrets.android_key_password }}
            ANDROID_KEYSTORE_PASSWORD: ${{ secrets.android_keystore_password }}
        steps:
            - name: Check out release tag
              uses: actions/checkout@v7
              with:
                  ref: ${{ env.CHECKOUT_REF }}
                  persist-credentials: false

            - uses: ./.github/actions/common-build-setup
              with:
                  java-version: '17'
                  secrets-properties: ${{ secrets.SECRETS_PROPERTIES }}

            - name: Decode keystore
              uses: akiojin/decode-base64-github-action@v1
              with:
                  base64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
                  output-path: '${{ github.workspace }}/android.keystore'

            - name: Build release APK
              run: ./gradlew :androidApp:assembleRelease

            - name: Rename APK
              run: mv androidApp/build/outputs/apk/release/*.apk "maiapp-${MAIAPP_BUILD_VERSION}.apk"

            - name: Upload APK artifact
              uses: actions/upload-artifact@v7
              with:
                  name: android-release
                  path: maiapp-${{ env.MAIAPP_BUILD_VERSION }}.apk

            - name: Upload APK to release
              if: env.PUBLISH == 'true'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh release upload "$RELEASE_TAG" "maiapp-${MAIAPP_BUILD_VERSION}.apk" --clobber --repo "${{ github.repository }}"

    build_ios:
        name: Build iOS (sideload IPA)
        runs-on: macos-latest
        needs: version
        env:
            VERSION: ${{ needs.version.outputs.version }}
        steps:
            - name: Check out release tag
              uses: actions/checkout@v7
              with:
                  ref: ${{ env.CHECKOUT_REF }}
                  persist-credentials: false

            - uses: ./.github/actions/common-build-setup
              with:
                  java-version: '17'
                  secrets-properties: ${{ secrets.SECRETS_PROPERTIES }}

            - uses: ./.github/actions/build-ios-sideload
              id: ipa
              with:
                  ipa-name: maiapp-${{ env.VERSION }}-sideload.ipa
                  marketing-version: ${{ env.VERSION }}

            - name: Upload IPA artifact
              uses: actions/upload-artifact@v7
              with:
                  name: ios-release
                  path: ${{ steps.ipa.outputs.ipa-path }}

            - name: Upload IPA to release
              if: env.PUBLISH == 'true'
              env:
                  GH_TOKEN: ${{ github.token }}
                  IPA_PATH: ${{ steps.ipa.outputs.ipa-path }}
              run: gh release upload "$RELEASE_TAG" "$IPA_PATH" --clobber --repo "${{ github.repository }}"
