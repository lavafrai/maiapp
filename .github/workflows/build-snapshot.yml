    build_web:
        name: Build WEB
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: ./.github/actions/common-build-setup
              with:
                  java-version: '21'
                  secrets-properties: ${{ secrets.SECRETS_PROPERTIES }}

            - name: Build with Gradle
              run: ./gradlew :composeApp:wasmJsBrowserDistribution

            - name: Upload WEB artifact
              uses: actions/upload-artifact@v7
              with:
                  name: web-artifact
                  path: composeApp/build/dist/wasmJs/productionExecutable

            - name: Upload pages artifact
              uses: actions/upload-pages-artifact@v5
              with:
                  name: pages-artifact
                  path: composeApp/build/dist/wasmJs/productionExecutable

    publish_rolling:
        name: Publish Rolling Release
        runs-on: ubuntu-latest
        needs: [ build_android, build_ios ]
        steps:
            - uses: actions/checkout@v7
            - name: Download artifacts
              uses: actions/download-artifact@v8
              with:
                  path: artifacts
                  merge-multiple: true

            - name: Publish to GitHub Releases
              shell: bash
              run: ls artifacts




    publish_pages:
        name: Publish WEB to GitHub Pages
        needs: [ build_web ]
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        # Deployments of consecutive pushes must not overlap
        concurrency:
            group: pages
            cancel-in-progress: false
        steps:
            - name: Publish WEB artifact
              id: deployment
              uses: actions/deploy-pages@v5
              with:
                  artifact_name: pages-artifact