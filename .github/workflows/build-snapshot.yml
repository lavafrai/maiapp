name: Build Snapshot

on:
    push:
        branches: [ "master" ]
        paths:
            - '.github/workflows/build-snapshot.yml'
            - '.github/actions/common-build-setup/**'
            - '.github/actions/build-ios-sideload/**'
            - 'androidApp/**'
            - 'composeApp/**'
            - 'iosApp/**'
            - 'models/**'
            - 'network/**'
            - 'shared/**'
            - 'gradle/**'
            - 'build.gradle.kts'
            - 'settings.gradle.kts'
            - 'gradle.properties'
    workflow_dispatch:

env:
    ANDROID_KEYSTORE: "../android.keystore"
    ANDROID_KEYSTORE_KEY: ${{ secrets.android_key_alias }}
    ANDROID_KEYSTORE_KEY_PASSWORD: ${{ secrets.android_key_password }}
    ANDROID_KEYSTORE_PASSWORD: ${{ secrets.android_keystore_password }}

jobs:
    build_android:
        name: Build Android
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: ./.github/actions/common-build-setup
              id: init
              with:
                  java-version: '17'
                  secrets-properties: ${{ secrets.SECRETS_PROPERTIES }}

            - name: Decode keystore
              uses: akiojin/decode-base64-github-action@v1
              with:
                  base64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
                  output-path: '/home/runner/work/${{ github.event.repository.name }}/${{ github.event.repository.name }}/android.keystore'

            - name: Build with Gradle
              run: ./gradlew :androidApp:assemble

            - name: Rename APK
              run: mv androidApp/build/outputs/apk/release/*.apk "androidApp/build/outputs/apk/release/maiapp-${{ steps.init.outputs.current-time }}.apk"

            - name: Upload Android artifact
              uses: actions/upload-artifact@v7
              with:
                  name: android-artifact
                  path: androidApp/build/outputs/apk/release/*.apk

    build_ios:
        name: Build iOS (sideload IPA)
        runs-on: macos-latest
        steps:
            - uses: actions/checkout@v7
            - uses: ./.github/actions/common-build-setup
              id: init
              with:
                  java-version: '17'
                  secrets-properties: ${{ secrets.SECRETS_PROPERTIES }}

            - uses: ./.github/actions/build-ios-sideload
              id: ipa
              with:
                  ipa-name: maiapp-${{ steps.init.outputs.current-time }}-sideload.ipa

            - name: Upload IPA artifact
              uses: actions/upload-artifact@v7
              with:
                  name: ios-artifact
                  path: ${{ steps.ipa.outputs.ipa-path }}

