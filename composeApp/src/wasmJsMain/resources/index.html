<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" href="favicon.ico" sizes="any">
        <title>maiapp</title>

        <script>
            // Registered before the app is loaded, so that failures of loading and compiling the wasm are shown too
            let crashShown = false;

            function showCrash(title, text, details) {
                if (crashShown) return;
                crashShown = true;

                const overlay = document.createElement("div");
                overlay.id = "crash";
                const dialog = document.createElement("div");
                dialog.id = "crash-dialog";
                overlay.appendChild(dialog);

                const titleElement = document.createElement("h2");
                titleElement.textContent = title;
                const textElement = document.createElement("p");
                textElement.textContent = text;
                dialog.append(titleElement, textElement);

                if (details) {
                    // textContent, not innerHTML: the error text must not be able to inject markup
                    const detailsElement = document.createElement("details");
                    const summary = document.createElement("summary");
                    summary.textContent = "Подробности";
                    const pre = document.createElement("pre");
                    pre.textContent = details;
                    detailsElement.append(summary, pre);
                    dialog.appendChild(detailsElement);
                }

                const buttons = document.createElement("div");
                buttons.id = "crash-buttons";
                const addButton = (label, onClick) => {
                    const button = document.createElement("button");
                    button.textContent = label;
                    button.onclick = onClick;
                    buttons.appendChild(button);
                    return button;
                };
                addButton("Перезагрузить", () => location.reload());
                if (details) {
                    const copyButton = addButton("Скопировать ошибку", () => {
                        navigator.clipboard?.writeText(details).then(() => copyButton.textContent = "Скопировано");
                    });
                }
                addButton("Закрыть", () => overlay.remove());

                const support = document.createElement("a");
                support.href = "https://t.me/maiapp3";
                support.target = "_blank";
                support.textContent = "Написать в поддержку";
                dialog.append(buttons, support);

                (document.body ?? document.documentElement).appendChild(overlay);
            }

            function describeError(error) {
                if (!(error instanceof Error)) return String(error);
                // Kotlin exceptions come as Error with the Kotlin type name and stack trace.
                // Chrome's stacks start with "Name: message", other browsers' don't
                const header = `${error.name}: ${error.message}`;
                if (!error.stack) return header;
                return error.stack.startsWith(header) ? error.stack : `${header}\n\n${error.stack}`;
            }

            function isUnsupportedBrowserError(error) {
                if (typeof WebAssembly !== "object") return true;
                // Thrown while compiling the app when the browser lacks WasmGC or other required features
                return error instanceof WebAssembly.CompileError || error instanceof WebAssembly.LinkError;
            }

            function showErrorCrash(error) {
                if (isUnsupportedBrowserError(error)) {
                    showCrash(
                        "Браузер не поддерживается",
                        "Для веб-версии нужен свежий браузер: Chrome или Edge 119+, Firefox 120+ или Safari 18.2+. Обновите браузер или установите приложение на телефон.",
                        describeError(error),
                    );
                } else {
                    showCrash(
                        "Произошла ошибка",
                        "Приложение столкнулось с ошибкой и может работать неправильно. Перезагрузите страницу. Если ошибка повторяется, пришлите её текст в поддержку.",
                        describeError(error),
                    );
                }
            }

            window.addEventListener("error", (event) => {
                // Not ours: browser extensions and cross-origin scripts without any details
                if (/^(chrome|moz|safari|safari-web)-extension:/.test(event.filename || "")) return;
                if (!event.error && event.message === "Script error.") return;
                // Harmless and common, not a crash
                if ((event.message || "").includes("ResizeObserver loop")) return;

                showErrorCrash(event.error ?? event.message);
            });

            window.addEventListener("unhandledrejection", (event) => {
                showErrorCrash(event.reason);
            });

            // The app script itself failed to load
            function onPanicError() {
                showCrash(
                    "Не удалось загрузить приложение",
                    "Проверьте подключение к интернету и перезагрузите страницу.",
                    null,
                );
            }
        </script>
        <style>
            html, body {
                width: 100%;
                height: 100%;
                margin: 0;
                padding: 0;
                overflow: hidden;
                background: var(--background);
                --background: #0f0f0f;
                --primary: #b0dcff;
                --loader-size: 75px;
            }
        </style>

        <style>
            @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap');

            #preloader {
                width: 100%;
                height: 100%;
                margin: 0;
                padding: 0;
                overflow: hidden;
                background: var(--background);
                display: flex;
                justify-content: center;
                align-items: center;

                opacity: 1;
                transition: opacity 0.3s;
            }

            #preloader-content {
                width: var(--loader-size);
                height: var(--loader-size);
                background: white;
                border-radius: 50%;
                display: inline-block;
                justify-content: center;
                align-items: center;

                &:before {
                    content: "";
                    width: var(--loader-size);
                    height: var(--loader-size);
                    position: absolute;
                    display: inline-block;
                    background: var(--background);
                    border-radius: 50%;
                    animation: ease-in-out 1s infinite loading;
                }

                &:after {
                    content: "";
                    width: var(--loader-size);
                    height: var(--loader-size);
                    position: absolute;
                    display: inline-block;
                    background: white;
                    border-radius: 50%;
                    animation: ease-in-out 1s infinite loading-inner;
                }
            }

            @keyframes loading {
                from {
                    scale: 0 0;
                }

                to {
                    scale: 1 1;
                }
            }

            @keyframes loading-inner {
                from {
                    scale: 0 0;
                }

                30% {
                    scale: 0 0;
                }

                95% {
                    scale: 1 1;
                }

                to {
                    scale: 1 1;
                }
            }

            #preloader-label {
                position: absolute;
                top: calc(var(--loader-size) + 50%);
                color: white;
                font-size: 20px;
                font-weight: bold;
                font-family: "JetBrains Mono", serif;
                font-optical-sizing: auto;
                font-style: normal;
            }

            #crash {
                position: fixed;
                inset: 0;
                z-index: 1000;
                display: flex;
                justify-content: center;
                align-items: center;
                padding: 16px;
                box-sizing: border-box;
                background: rgba(0, 0, 0, 0.7);
                font-family: system-ui, sans-serif;
            }

            #crash-dialog {
                max-width: 560px;
                width: 100%;
                max-height: 100%;
                overflow: auto;
                box-sizing: border-box;
                padding: 24px;
                border-radius: 24px;
                background: #1c1c1c;
                color: white;
            }

            #crash-dialog h2 {
                margin: 0 0 12px;
            }

            #crash-dialog p {
                margin: 0 0 16px;
                opacity: 0.85;
                line-height: 1.4;
            }

            #crash-dialog summary {
                cursor: pointer;
                color: var(--primary);
            }

            #crash-dialog pre {
                max-height: 40vh;
                overflow: auto;
                padding: 12px;
                border-radius: 12px;
                background: var(--background);
                font-family: "JetBrains Mono", monospace;
                font-size: 12px;
                white-space: pre-wrap;
                word-break: break-word;
            }

            #crash-buttons {
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
                margin: 16px 0 12px;
            }

            #crash-buttons button {
                padding: 10px 16px;
                border: none;
                border-radius: 20px;
                background: var(--primary);
                color: #0f0f0f;
                font-weight: bold;
                cursor: pointer;
            }

            #crash-dialog a {
                color: var(--primary);
            }

            #copyright-label {
                position: absolute;
                bottom: 10px;
                color: white;
                font-size: 14px;
                font-weight: lighter;
                opacity: 0.8;
                font-family: "JetBrains Mono", serif;
                font-optical-sizing: auto;
                font-style: normal;
            }
        </style>
    </head>
    <body>
        <div id="preloader">
            <div id="preloader-content">
            </div>
            <div id="preloader-label">
                Loading…
            </div>
            <div id="copyright-label">
                MAIapp by. lava_frai
            </div>
        </div>
    </body>
    <script>
        function onWasmLoaded() {
            const preloader = document.getElementById('preloader');
            preloader.style.opacity = "0";
            setTimeout(() => {
                preloader.style.display = "none";
            }, 300);
        }

    </script>

    <script src="composeApp.js" onerror="onPanicError()"></script>
</html>
