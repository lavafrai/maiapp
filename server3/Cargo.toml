[package]
name = "server3"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["http2", "macros"] }
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
encoding_rs = "0.8"
futures = "0.3"
html-escape = "0.2"
md5 = "0.8"
mime_guess = "2.0"
regex = "1.11"
# Not the "rustls" feature: its aws-lc-rs backend needs more C tooling in the Alpine image; ring is installed in main
reqwest = { version = "0.13", default-features = false, features = ["charset", "gzip", "brotli", "deflate", "json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
scraper = "0.27"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "signal"] }
tower-http = { version = "0.7", features = ["cors", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
urlencoding = "2.1"
